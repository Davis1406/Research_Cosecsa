<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 170" width="480" height="170">
  <rect width="480" height="170" fill="white"/>

  <!-- Open circle dot above the 'i' (centered around x=248 which is mid-word) -->
  <circle cx="248" cy="22" r="8" fill="none" stroke="#3D4FA1" stroke-width="3"/>

  <!-- INTUITIVE — thin weight, wide tracking, indigo blue -->
  <text
    x="240"
    y="95"
    text-anchor="middle"
    font-family="'Century Gothic','Futura',Trebuchet MS,Helvetica Neue,Arial,sans-serif"
    font-size="66"
    font-weight="300"
    letter-spacing="12"
    fill="#3D4FA1">INTUITIVE</text>

  <!-- Foundation — lighter weight, black, centered -->
  <text
    x="240"
    y="145"
    text-anchor="middle"
    font-family="'Century Gothic','Futura',Trebuchet MS,Helvetica Neue,Arial,sans-serif"
    font-size="38"
    font-weight="300"
    letter-spacing="2"
    fill="#111">Foundation</text>
</svg>
